[project]
name = "small-assistant-over-your-own-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mariamalaa76", email = "mariamalaa76200@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "groq>=1.7.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "striprtf>=0.0.33",
]

[project.scripts]
small-assistant-over-your-own-data = "small_assistant_over_your_own_data:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
